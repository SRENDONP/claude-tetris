<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
            <span class="theme-switch"></span>
            <span id="theme-text">Oscuro</span>
          </button>
        </div>

        <div class="panel-section skin-section">
          <label class="label" for="skin-select">SKIN</label>
          <select id="skin-select" class="skin-select"></select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Menú de pausa (P / Escape) -->
    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <div id="pause-main" class="pause-view">
          <p id="pause-title" class="pause-title">PAUSA</p>
          <button type="button" class="menu-btn" id="resume-btn">Reanudar</button>
          <button type="button" class="menu-btn" id="pause-restart-btn">Reiniciar</button>
          <button type="button" class="menu-btn" id="controls-btn">Ver controles</button>
          <label class="start-level" for="start-level">
            <span>Nivel inicial</span>
            <select id="start-level"></select>
          </label>
          <p class="pause-hint">Se aplica al reiniciar o en la próxima partida</p>
        </div>

        <div id="pause-controls" class="pause-view hidden">
          <p class="pause-title">CONTROLES</p>
          <ul class="pause-keys">
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd> / <kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar (+1)</li>
            <li><span><kbd>Space</kbd></span> caída instantánea</li>
            <li><span><kbd>P</kbd> / <kbd>Esc</kbd></span> pausa / reanudar</li>
          </ul>
          <button type="button" class="menu-btn" id="controls-back-btn">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="tetris-core.js"></script>
  <script src="skins.js"></script>
  <script src="game.js"></script>
</body>
</html>
